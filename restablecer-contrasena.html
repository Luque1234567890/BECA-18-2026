<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="members.css"></head><body class="portal"><main class="portal-main"><section class="portal-card"><p class="eyebrow">SEGURIDAD</p><h1>Nueva contraseña</h1><form id="reset-form" class="form-grid"><label class="field full">Nueva contraseña<input name="password" type="password" minlength="10" required></label><button class="button primary">GUARDAR CONTRASEÑA</button></form><p class="notice" id="notice"></p></section></main><script type="module">import {request} from './membership.js';document.querySelector('#reset-form').addEventListener('submit',async e=>{e.preventDefault();const n=document.querySelector('#notice');try{await request('/api/auth/reset-password',{token:new URLSearchParams(location.search).get('token'),password:new FormData(e.currentTarget).get('password')});n.textContent='Contraseña actualizada. Ahora puedes iniciar sesión.';n.className='notice success'}catch(x){n.textContent=x.message}})</script></body></html>
