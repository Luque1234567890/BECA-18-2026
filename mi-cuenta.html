<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | Impulsa Beca 18</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="members.css"></head><body class="portal"><header class="portal-header"><a href="index.html">← Impulsa Beca 18</a><button class="button outline" id="logout" type="button">Cerrar sesión</button></header><main class="portal-main"><section id="auth-view" class="portal-grid"><article class="portal-card"><p class="eyebrow">ACCESO</p><h1>Inicia sesión</h1><form id="login-form" class="form-grid"><label class="field full">Correo<input name="email" type="email" autocomplete="email" required></label><label class="field full">Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">INGRESAR</button></form><p><a href="#recuperar" id="show-recovery">¿Olvidaste tu contraseña?</a></p><p class="notice" id="login-notice"></p></article><article class="portal-card"><p class="eyebrow">REGISTRO</p><h2>Crea tu cuenta</h2><form id="register-form" class="form-grid"><label class="field">Nombres<input name="firstName" required></label><label class="field">Apellidos<input name="lastName" required></label><label class="field full">Correo<input name="email" type="email" required></label><label class="field full">Celular<input name="phone" inputmode="tel" required></label><label class="field full">Contraseña (mín. 10 caracteres)<input name="password" type="password" minlength="10" required></label><label class="field">Departamento<input name="department" required></label><label class="field">Provincia<input name="province" required></label><label class="field full">Distrito<input name="district" required></label><button class="button primary" type="submit">CREAR CUENTA</button></form><p class="notice" id="register-notice"></p></article><article class="portal-card hidden" id="recovery-card"><h2>Recupera tu contraseña</h2><form id="recovery-form" class="form-grid"><label class="field full">Correo<input name="email" type="email" required></label><button class="button primary" type="submit">ENVIAR ENLACE</button></form><p class="notice" id="recovery-notice"></p></article></section><section id="account-view" class="hidden"><div class="portal-card"><p class="eyebrow">MI CUENTA</p><h1 id="account-name"></h1><p id="account-contact"></p><div id="membership-summary"></div><a class="button primary" id="continue-study" href="preparacion.html">CONTINUAR ESTUDIANDO</a></div><div class="plans-portal" id="plans"><article class="plan-choice"><h3>Preparación Básica</h3><strong>S/39</strong><p>30 días desde la aprobación del pago.</p><button class="button primary" data-plan="basic">ELEGIR S/39</button></article><article class="plan-choice complete"><h3>Preparación Completa</h3><strong>S/100</strong><p>Vigente hasta la fecha de examen configurada.</p><button class="button gold" data-plan="complete">ELEGIR S/100</button></article></div><p class="notice" id="payment-notice"></p></section></main><script type="module" src="membership.js"></script></body></html>
